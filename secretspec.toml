[project]
name = "forge-assets-import"
revision = "1.0"

[profiles.default]
# CLI-targeting values: where and how `forge` commands operate. These are
# not app secrets, but SecretSpec is also the disciplined, non-interactive
# way this repo supplies them to the opt-in `forge:*` scripts.
FORGE_SITE = { description = "Forge site hostname, e.g. example.atlassian.net", required = true }
FORGE_PRODUCT = { description = "Forge product (jira, confluence, compass, jsm)", default = "jira" }
FORGE_ENVIRONMENT = { description = "Forge environment name (development, staging, production)", default = "development" }

# App-level runtime secrets, pushed to the deployed app via
# `npm run forge:variables:set`. None are declared today: the DummyJSON
# sample source requires no authentication, so this app has no runtime
# secrets to push. Add a key here (and to APP_VARIABLE_KEYS in
# scripts/forge-vars-from-secretspec.js) if a future external source needs
# a real credential, such as an API token.
