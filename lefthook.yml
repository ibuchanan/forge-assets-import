colors: false
output:
  - meta
  - summary
  - failure

lint:
  parallel: true
  commands:
    prelint:
      run: npm run lint:prelint
    biome:
      run: npm run lint:check
    forge:
      run: npm run lint:forge
    typecheck:
      run: npm run typecheck

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact
    format:
      run: npm run format:check
    lint:
      run: npm run lint:check

pre-push:
  commands:
    format:
      run: npm run format:check
    lint:
      run: npx lefthook run lint
    test:
      run: npm run test
